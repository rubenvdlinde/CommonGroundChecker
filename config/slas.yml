# SLAs on followed components. A maintainer or the party that agreed the SLA adds it by
# pull request; the pull request check validates this file against
# config/schema/slas.schema.json.
#
# Fields (all required except link):
#   repository  the url of the component, as in config/repositories.yml
#   party       who agreed the SLA, for example VNG
#   maintainer  the organisation that maintains the component under the SLA
#   start       first day, YYYY-MM-DD
#   until       last day, YYYY-MM-DD
#   link        a public link to the SLA
#
# Example:
#   - repository: https://github.com/open-zaak/open-zaak
#     party: VNG
#     maintainer: Maykin
#     start: 2026-01-01
#     until: 2026-12-31
#     link: https://example.org/sla.pdf

slas: []
