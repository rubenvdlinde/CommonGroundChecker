# The component list of the Common Ground Checker.
#
# Every repository listed here is scanned every night. To add a component, open a
# pull request that adds an entry; see docs/run-without-a-server in the site, or
# .github/PULL_REQUEST_TEMPLATE/component.md. The pull request check validates this
# file against config/schema/repositories.schema.json.
#
# Fields (only url is required):
#   url         public https URL of the repository
#   basisset    true when the component is in the Common Ground basisset
#               (code.overheid.nl/CommonGround/vcg-basisset, data/components.json)
#   scanRef     latest-release, default-branch, or a branch or tag name
#   register    true when the component is a register
#   hints       paths the checker would not find itself: helm, docker, docs, apiSpecs
#   slaLabels   issue labels that mark an issue as covered by an SLA
#   retired     on (YYYY-MM-DD) and reason; a retired component is no longer scanned
#   providers   organisations that offer services on top of the component:
#               name, services (maintenance, support, hosting, implementation, training),
#               url, contact (a general address, no personal data), since (YYYY-MM-DD)
#   functionalities
#               what the component does, as ids from config/functionalities.yml (the
#               GEMMA application services); see /functionalities in the site
#   functionalitiesDraft
#               true while the component owner has not confirmed the functionalities
#
# Seeded on 2026-11-19 from the repositories the preview instance had stored. The
# basisset marks come from vcg-basisset data/components.json version 0.3.1.
# The functionalities were seeded on 2026-11-20 from each component's README and
# publiccode.yml. They are a draft until the component owners confirm them.

